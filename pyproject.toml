[project]
name = "guestshots"
version = "0.1.0"
description = "Pull flattering, active guest screenshots out of podcast YouTube videos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yt-dlp>=2025.1.1",
    "insightface>=0.7.3",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.9",
    "numpy<2.3",
    "pillow>=10",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "mediapipe==0.10.14",
    "protobuf>=4.25.3,<5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
guestshots = "guestshots.cli:app"
guestshots-server = "guestshots.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guestshots"]

[tool.hatch.build.targets.wheel.force-include]
"guestshots/web" = "guestshots/web"
